# 在 GitHub 提供的 Apple 芯片 Mac 上打包 ShotPilot.app：
# 构建 → 装进自带组件 → 打包 → 签名（本机签名，没有苹果开发者证书）→ 冒烟测试 → 发布安装包
name: Mac 软件

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'templates/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mac-app.yml'

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ELECTRON_VERSION: 44.4.5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试
        run: pnpm test && pnpm typecheck

      - name: 构建界面、模板、服务
        run: pnpm build

      - name: 准备软件内容（自带 ffmpeg、yt-dlp、渲染浏览器）
        run: desktop/stage.sh

      - name: 生成图标
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s desktop/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) desktop/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o desktop/icon.icns

      - name: 打包 ShotPilot.app
        run: |
          npx --yes @electron/packager@20.3.0 app-stage ShotPilot \
            --platform=darwin --arch=arm64 --electron-version=$ELECTRON_VERSION \
            --out=release --overwrite --no-prune --no-asar --icon=desktop/icon.icns \
            --app-bundle-id=com.shotpilot.app --app-category-type=public.app-category.video \
            --app-version="$(node -p "require('./package.json').version")"
          ls -la release/ShotPilot-darwin-arm64
          ls -la release/ShotPilot-darwin-arm64/ShotPilot.app/Contents/Resources/app

      - name: 签名（本机签名）
        run: |
          APP=release/ShotPilot-darwin-arm64/ShotPilot.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          du -sh "$APP"

      - name: 冒烟测试
        run: desktop/smoke-test.sh release/ShotPilot-darwin-arm64/ShotPilot.app smoke-out

      - name: 双击打开测试（截图）
        continue-on-error: true
        run: desktop/gui-test.sh release/ShotPilot-darwin-arm64/ShotPilot.app smoke-out

      - name: 做安装包（DMG）
        run: |
          mkdir -p dmgroot
          cp -R release/ShotPilot-darwin-arm64/ShotPilot.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname ShotPilot -srcfolder dmgroot -ov -format UDZO release/ShotPilot.dmg
          ls -la release/ShotPilot.dmg

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out
          path: smoke-out
          if-no-files-found: ignore

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ShotPilot-dmg
          path: release/ShotPilot.dmg

      - name: 发布到 mac-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，提交 ${GITHUB_SHA::7}。Apple 芯片 Mac 专用。"
          if gh release view mac-latest >/dev/null 2>&1; then
            gh release upload mac-latest release/ShotPilot.dmg --clobber
            gh release edit mac-latest --notes "$NOTE"
          else
            gh release create mac-latest release/ShotPilot.dmg --title "ShotPilot Mac 版（最新）" --notes "$NOTE" --prerelease
          fi
